# Conda environment of the project (same versions as requirements.txt)
name: imdb-sentiment
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.14.1
      - scikit-learn==1.5.2
      - joblib==1.4.2
      - pandas==2.2.3
      - pyarrow==17.0.0
      - datasets==3.0.1
      - huggingface-hub==0.25.2
